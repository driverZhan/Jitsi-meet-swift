name: JitsiObjCDemo

options:
  bundleIdPrefix: org.jitsi.swift.objc
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    # LJMeet 是 CocoaPods 集成的静态框架（见 Podfile）：framework、bundle 与
    # user_target_xcconfig 都由 pod 注入，工程里不再手动引用 dist/ 交付物。
    # Swift usage stays enabled (via SwiftRuntimeAnchor.swift) so the Swift runtime is
    # linked and copied.
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  JitsiObjCDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    # 系统框架不在这里声明：LJMeet.podspec 的 s.frameworks 已通过 Pods 的
    # OTHER_LDFLAGS 注入全部 -framework（含 Accelerate/AVFoundation/CoreMedia/
    # CoreVideo/CoreImage/JavaScriptCore/ReplayKit/SwiftUI/UIKit/Combine/Network/
    # UserNotifications），这里再列一遍会重复链接。
    dependencies: []
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Jitsi ObjC Demo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Required when linking against the iOS 26+ SDK: launch traps with
        # _UIApplicationEvaluateRuntimeIssueForNoSceneLifecycleAdoption otherwise.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Microphone access is required to join a meeting.
        NSCameraUsageDescription: Camera access is required to join a meeting.
        NSPhotoLibraryAddUsageDescription: Finished recordings are saved to Photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.jitsi.swift.objc.demo
        PRODUCT_NAME: JitsiObjCDemo
